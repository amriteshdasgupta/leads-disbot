name = "lead-responder"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# worker-mailer (Gmail sending) needs Node compatibility.
compatibility_flags = ["nodejs_compat"]

# Picks up leads who never finished the form, and retries anything that failed.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "LEADS"
id = "REPLACE_WITH_KV_ID" # npm run setup fills this in

[vars]
# Who emails come from.
#   "gmail":  from GMAIL_USER (secret), shown as SENDER_NAME. Lands in that Gmail's Sent folder.
#   "resend": from FROM_EMAIL, through Resend (needs RESEND_API_KEY and a verified domain).
EMAIL_PROVIDER = "gmail"
SENDER_NAME = "Alex"
FROM_EMAIL = "Alex from Acme <hello@example.com>"
ALLOWED_ORIGINS = "https://example.com,https://www.example.com,https://example.org,https://www.example.org"
AUTO_SEND_DAILY_LIMIT = "40"

[observability]
enabled = true
